{% extends "admin/base.html" %}
{% load static %} 
{% block content %}

<style>
    .form-container {
        max-width: 600px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
        margin-top: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        font-weight: bold;
        display: block;
    }

    input, textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #0069d9;
    }
</style>

<div class="form-container">
    <h2>{% if form.instance.pk %}Edit Brand{% else %}Add Brand{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.brand_name.id_for_label }}">Brand Name</label>
            {{ form.brand_name }}
        </div>
        <div class="form-group">
            <label for="{{ form.short_description.id_for_label }}">Short Description</label>
            {{ form.short_description }}
        </div>
        <div class="form-group">
            <label for="{{ form.brand_image.id_for_label }}">Brand Image</label>
            {{ form.brand_image }}
        </div>
        <div class="form-group">
            <label for="{{ form.swiggy_url.id_for_label }}">Swiggy URL</label>
            {{ form.swiggy_url }}
        </div>
        <div class="form-group">
            <label for="{{ form.zomato_url.id_for_label }}">Zomato URL</label>
            {{ form.zomato_url }}
        </div>

        <button type="submit">{% if form.instance.pk %}Update{% else %}Submit{% endif %}</button>
    </form>
</div>

{% endblock content %}
