{% extends "admin/base.html" %}
{% load static %} 
{% block content %}

<style>
    .form-container {
        max-width: 600px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
        margin-top: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        font-weight: bold;
        display: block;
    }

    input, textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #218838;
    }
</style>

<div class="form-container">
    <h2>{% if form.instance.pk %}Edit Package{% else %}Add Package{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.name.id_for_label }}">Package Name</label>
            {{ form.name }}
        </div>
        <div class="form-group">
            <label for="{{ form.price.id_for_label }}">Price</label>
            {{ form.price }}
        </div>
        <div class="form-group">
            <label for="{{ form.description.id_for_label }}">Short Description</label>
            {{ form.description }}
        </div>
        <div class="form-group">
            <label for="{{ form.features.id_for_label }}">Features</label>
            {{ form.features }}
        </div>
        <div class="form-group">
            <label for="{{ form.detailed_description.id_for_label }}">Detailed Description</label>
            {{ form.detailed_description }}
        </div>
        <button type="submit">{% if form.instance.pk %}Update{% else %}Submit{% endif %}</button>
    </form>
</div>

{% endblock content %}
