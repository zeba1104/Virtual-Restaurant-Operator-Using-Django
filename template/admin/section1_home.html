{% extends "admin/base.html" %}
{% load static %} 
{% block content %}

<style>
    .form-container {
        max-width: 600px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
        margin-top: 20px;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        font-weight: bold;
        display: block;
    }

    input, textarea, select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #218838;
    }
</style>

<div class="form-container">
    <h2>{% if form.instance.pk %}Edit Content{% else %}Add Content{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="{{ form.title.id_for_label }}">Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label for="{{ form.heading.id_for_label }}">Heading</label>
            {{ form.heading }}
        </div>

        <div class="form-group">
            <label for="{{ form.content.id_for_label }}">Content</label>
            {{ form.content }}
        </div>

        <div class="form-group">
            <label for="{{ form.image.id_for_label }}">Upload Image</label>
            {{ form.image }}
        </div>

        <div class="form-group">
            <label for="{{ form.button_name.id_for_label }}">Button Name</label>
            {{ form.button_name }}
        </div>

        <div class="form-group">
            <label for="{{ form.button_link.id_for_label }}">Button Link</label>
            {{ form.button_link }}
        </div>

        <button type="submit">{% if form.instance.pk %}Update{% else %}Submit{% endif %}</button>
    </form>
</div>

{% endblock content %}
